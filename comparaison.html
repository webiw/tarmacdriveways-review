<script>"use strict";

const entries = JSON.parse(document.getElementById("comparison-data").textContent);
const filter = document.getElementById("filter");
const picker = document.getElementById("route");
const output = document.getElementById("comparison");
const count = document.getElementById("result-count");

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function link(text, url, external = false) {
  const node = element("a", text);
  node.href = url;
  if (external) {
    node.target = "_blank";
    node.rel = "nofollow noopener";
  }
  return node;
}

function render() {
  const page = entries.find(entry => entry.route === picker.value);
  output.replaceChildren();
  if (!page) {
    output.append(element("p", "No URL matches that filter."));
    return;
  }
  const title = element("h2", page.route, "path");
  const links = element("div", "", "links");
  links.append(link("Open live page", page.live, true), link("Open preview", page.preview));
  const devices = element("div", "", "device-rows");
  for (const [device, label] of [["desktop", "Desktop · 1440 × 900"], ["mobile", "Mobile · 390 × 844"]]) {
    const section = element("section", "", `device ${device}`);
    const shots = element("div", "", "shots");
    for (const [side, caption] of [["live", "Live"], ["preview", "Preview"]]) {
      const figure = element("figure");
      figure.append(element("figcaption", caption));
      const source = page.devices[device][side];
      if (source) {
        const full = link("", source);
        const image = element("img");
        image.src = source;
        image.alt = `${caption}, ${device}, top middle and bottom of ${page.route}`;
        image.loading = "lazy";
        image.width = device === "desktop" ? 1440 : 390;
        image.height = 3 * (device === "desktop" ? 900 : 844);
        full.append(image);
        figure.append(full);
      } else {
        figure.append(element("p", "Capture pending", "missing"));
      }
      shots.append(figure);
    }
    section.append(element("h2", label), shots);
    devices.append(section);
  }
  output.append(title, links, devices);
}

function update() {
  const value = picker.value || new URLSearchParams(location.search).get("url") || "/";
  const query = filter.value.trim().toLowerCase();
  const matches = entries.filter(entry => entry.route.toLowerCase().includes(query) || entry.live.toLowerCase().includes(query));
  const options = matches.map(entry => new Option(entry.route, entry.route));
  picker.replaceChildren(...options);
  if (matches.some(entry => entry.route === value)) picker.value = value;
  count.textContent = `${matches.length} URL${matches.length === 1 ? "" : "s"}`;
  render();
}

filter.addEventListener("input", update);
picker.addEventListener("change", () => {
  const url = new URL(location.href);
  url.searchParams.set("url", picker.value);
  history.replaceState(null, "", url);
  render();
});
update();
</script>
